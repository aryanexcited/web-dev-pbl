<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link rel="stylesheet" href="login-signup.css">
</head>

<!-- ✅ ADD CLASS HERE -->
<body class="signup-page">

<div class="container">
    <div class="login-box">
        <h2>Create Account</h2>
        <p>Fill details to register</p>

        <form id="signupForm">

            <div class="role-select">
                <label><input type="radio" name="role" value="admin"> Admin</label>
                <label><input type="radio" name="role" value="operator"> Operator</label>
                <label><input type="radio" name="role" value="cashier"> Cashier</label>
                <label><input type="radio" name="role" value="customer"> Customer</label>
            </div>
            
            <div class="input-box">
                <input type="text" id="newUser" placeholder="User Name">
            </div>

            <div class="input-box">
                <input type="password" id="newPass" placeholder="Password">
                <span class="icon" onclick="togglePassword('newPass')">👁️</span>
            </div>

            <div class="input-box">
                <input type="password" id="confirmPass" placeholder="Confirm Password">
                <span class="icon" onclick="togglePassword('confirmPass')">👁️</span>
            </div>

            <button type="submit" class="btn">Signup</button>

            <p class="signup">
                Already have an account? <a href="login.html">Login</a>
            </p>

            <p id="signupMsg"></p>
        </form>
    </div>
</div>

<script src="script-login-signup.js"></script>
</body>
</html>
