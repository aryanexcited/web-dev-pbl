<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main-page.css">
</head>
<body>
    <header class="topbar">
        <div class="search-box">
            <span class="icon">🔍</span>
            <input type="text" placeholder="Search-Items">
        </div>
        
        <div class="actions">
            <a href="">Profile</a>
            <span class="icon">👤</span>
        </div>
    </header>
    <div class="main-section">
        <div class="left">
            <div class ="section-title">
                <span>Manual entry</span>
                <div class="title-line"></div>
            </div>
            <input class="code-input" type="text" value="5509" readonly>
    
            <div class="product-preview">
                <div class="img"></div>
                <div class="info">
                    <p>Gildan Ultra Cotton</p>
                    <p>Price: $12.99</p>
                </div>
            </div>
    
            <div class="keypad">
                <button>1</button><button>2</button><button>3</button><button>Shift</button>
                <button>4</button><button>5</button><button>6</button><button></button>
                <button>7</button><button>8</button><button>9</button><button></button>
                <button></button><button>0</button><button></button><button></button>
            </div>
    
            <div class="left-buttons">
                <button type="submit">Add to cart</button>
                <button type="reset">Clear</button>
            </div>
        </div>
        <div class="right">
            <div class="checkout">
                <h2 class="checkout-title">Current Order</h2>
                <div class="cart-items">
                    <div class="cart-item">
                        <div class="item-img"></div>
                        <div class="item-info">
                            <p class="item-name">Gildan Ultra cotton</p>
                        </div>
                        <button class="remove">x</button>
                    </div>
                    <div class="cart-item">
                        <div class="item-img"></div>
                        <div class="item-info">
                            <p class="item-name">1x Reynolds Sharpie</p>
                        </div>
                        <button class="remove">×</button>
                    </div>

                    <div class="cart-item">
                        <div class="item-img"></div>
                        <div class="item-info">
                            <p class="item-name">Shampoo</p>
                        </div>
                        <button class="remove">×</button>
                    </div>

                    <div class="cart-item">
                        <div class="item-img"></div>
                        <div class="item-info">
                            <p class="item-name">Dettol</p>
                        </div>
                        <button class="remove">×</button>
                    </div>
                </div>
                <div class="bill">
                    <div class="row"><span>Subtotal</span><span>₹ --</span></div>
                    <div class="row"><span>Tax</span><span>₹ --</span></div>
                    <div class="row total"><span>Total</span><span>₹ --</span></div>
                </div>
                <div class="payments">
                    <button class="pay wallet">Wallet</button>
                    <button class="pay card">Credit Card</button>
                    <button class="pay cash">Cash</button>
                    <button class="pay gift">Gift Card</button>
                </div>
                <button class="complete">Complete Purchase</button>
            </div>
        </div>
    </div>

</body>
</html>
